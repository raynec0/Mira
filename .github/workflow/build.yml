name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply uploaded update zip (if any)
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              echo "Applying $z"
              rm -rf _update && mkdir _update
              unzip -q -o "$z" -d _update
              src=_update
              if [ -f _update/Mira/project.yml ]; then src=_update/Mira; fi
              rsync -a --exclude '.github' --exclude '__MACOSX' "$src"/ ./
              rm -rf _update "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply update from uploaded zip" || true
            git push || echo "Push failed; building with the applied files anyway"
          fi

      - name: Select Xcode 26 for native Liquid Glass
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test message grouping on simulator
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -target Mira \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "======== 编译错误汇总（复制这里发给 Claude） ========"
          grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Mira.app Payload/
          zip -qry Mira.ipa Payload
          ls -lh Mira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mira-ipa
          path: Mira.ipa
